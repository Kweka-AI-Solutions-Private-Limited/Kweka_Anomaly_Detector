steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/kweka-anomaly-detector:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/kweka-anomaly-detector:latest'
      - '.'

  # Step 2: Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/kweka-anomaly-detector'

  # Step 3: Deploy to Cloud Run with production resources (PatchCore PyTorch inference)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'kweka-anomaly-detector'
      - '--image=gcr.io/$PROJECT_ID/kweka-anomaly-detector:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--timeout=3600'
      - '--min-instances=1'
      - '--max-instances=4'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--no-cpu-throttling'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/kweka-anomaly-detector:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/kweka-anomaly-detector:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
