name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud using Service Account key stored in GitHub Secrets
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Configure Docker to use gcloud as credential helper
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      # 5. Build the Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/kweka-anomaly-detector:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/kweka-anomaly-detector:latest \
            .

      # 6. Push Docker image to Google Container Registry
      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/kweka-anomaly-detector:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/kweka-anomaly-detector:latest

      # 7. Deploy to Cloud Run with production-ready settings
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy kweka-anomaly-detector \
            --image=gcr.io/${{ secrets.GCP_PROJECT_ID }}/kweka-anomaly-detector:${{ github.sha }} \
            --region=asia-south1 \
            --platform=managed \
            --timeout=3600 \
            --min-instances=1 \
            --max-instances=4 \
            --memory=4Gi \
            --cpu=2 \
            --no-cpu-throttling \
            --allow-unauthenticated \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars="MONGODB_URI=${{ secrets.MONGODB_URI }},ENV=production"

      # 8. Print the deployed service URL
      - name: Get Service URL
        run: |
          gcloud run services describe kweka-anomaly-detector \
            --region=asia-south1 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)"
